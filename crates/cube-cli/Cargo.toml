[package]
name = "cube-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "cube-cli"
path = "src/main.rs"

[dependencies]
cube-core.workspace = true
cube-terminal.workspace = true
cube-paths.workspace = true
cube-process.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
