[package]
name = "cube"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "cube"

[[bin]]
name = "cube"
path = "src/main.rs"

[dependencies]
cube-core.workspace = true
cube-paths.workspace = true
cube-terminal.workspace = true
cube-ghostty.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# 逐语言启用语法高亮，而不是打开 `tree-sitter-languages`（那会静态链接
# 全部 37 种语法，约 35MB）。这里列出的必须和
# `editor_syntax::language_for_path` 支持的扩展名一致，否则对应文件
# 会静默退化成纯文本。
# json / plain 是内置的，不需要特性；scss 复用 css 文法。
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
gpui-kit-assets.workspace = true
reqwest_client.workspace = true
anyhow.workspace = true
log.workspace = true
ttf-parser = "0.25"
env_logger.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
futures.workspace = true
notify.workspace = true
tokio.workspace = true
uuid.workspace = true
rust-embed.workspace = true
dirs.workspace = true
chrono.workspace = true
reqwest.workspace = true
url.workspace = true
webbrowser = "1.2.4"
# 只用到 `to_mdast` 做语法树遍历，不需要 serde 序列化。
markdown = { version = "1.0.0", default-features = false }
html5ever.workspace = true
markup5ever_rcdom.workspace = true
ropey.workspace = true
regex = "1"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
unicode-width.workspace = true
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",  # AddVectoredExceptionHandler
    "Win32_System_Kernel",             # EXCEPTION_POINTERS definition
    "Win32_System_Pipes",              # WaitNamedPipeW
    "Win32_Graphics_Dwm",              # DwmSetWindowAttribute — Mica/Acrylic backdrop
    "Win32_Graphics_Gdi",              # WNDCLASSW for accessibility settings listener
    "Win32_UI_WindowsAndMessaging",     # FlashWindowEx for terminal notifications
] }
# Windows GhosttyView wraps D3D11-readback BGRA frames in a GPUI RenderImage.
smallvec = "1"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
unicode-width.workspace = true
x11rb = "0.13.2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification"] }
# Linux wraps shared libghostty-vt Kitty RGBA snapshots in GPUI
# `RenderImage`s, whose constructor exposes these concrete crate types.
smallvec = "1"
fontdb = "0.23"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"
# Exercise the same multi-resolution encoder used by the Windows build script.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# Layout tests use gpui's visual test harness (debug_bounds, TestAppContext).
gpui = { workspace = true, features = ["test-support"] }
# Inspect the theme projection consumed by the component library's primitives.
gpui-base = "=0.7.0"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[package.metadata.bundle]
icon = ["../../assets/app-icons/cube-raccoon-tail-A6.png"]
identifier = "co.nowledge.con"
name = "con"
osx_minimum_system_version = "10.15.7"
