[workspace]
members = [
    "crates/con-app",
    "crates/con-core",
    "crates/con-paths",
    "crates/con-terminal",
    "crates/con-ghostty",
    "crates/con-cli",
    "crates/con-process",
    "crates/con-test",
]
default-members = ["crates/con-app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Internal crates
con-core = { path = "crates/con-core" }
con-paths = { path = "crates/con-paths" }
con-terminal = { path = "crates/con-terminal" }
con-ghostty = { path = "crates/con-ghostty" }
con-process = { path = "crates/con-process" }

# UI — Zed's GPUI via the `gpui-pre-*` crates.io snapshots (0.3.7 = zed@1a28cff).
# Pin them exactly to the snapshot gpui-component was released against and bump
# both together: any snapshot may change GPUI's API, and two snapshots in one
# tree are incompatible types.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }

# UI Components — upstream gpui-component, never local 3pp paths
gpui-component = "=0.7.0"
gpui-kit-assets = "=0.7.0"

# Async
# 精确特性而非 "full"："full" 会带上 process / fs / signal / macros 等
# 本项目没用到的模块。生产代码只需要 runtime + net（control.rs 的
# Unix socket 服务）+ io/sync/time（updater 的 HTTP 超时）。
# reqwest 会自己再启用它需要的部分。
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
] }
futures = "0.3"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Text & Language
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
unicode-width = "0.2"
html5ever = "0.39.0"
markup5ever_rcdom = "=0.39.0"

# Utilities
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "7.0.0"
smallvec = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
url = "2"
rust-embed = { version = "8.7.2", features = [
    "interpolate-folder-path",
    "include-exclude",
] }

[workspace.lints.clippy]
# Inherited by gpui-component crates
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 1

[profile.release]
# fat LTO 让跨 crate 内联更彻底，减小体积也略提性能；编译明显更慢。
lto = "fat"
codegen-units = 1
# 剥掉符号表（约 10MB）。调试符号本来也不发布。
strip = "symbols"
# 注意不要加 panic = "abort"：con-ghostty/src/vt.rs 的 PNG 解码回调
# 和 con-app/src/updater.rs 的初始化都用 catch_unwind 兜住 panic
# （前者 panic 越过 C ABI 边界是未定义行为），abort 会让这两层失效。
# 实测能再省约 12MB，但代价是崩溃隔离没了。

# Temporary reviewed presentation fix; remove after a compatible official release.
# See docs/design/native-terminal-presentation.md for provenance and exit criteria.
[patch.crates-io]
gpui-pre = { git = "https://github.com/wey-gu/zed", rev = "655ce8bbc10e1f1ef3d1d5bdf5a3405008157792" }
gpui-pre-apple = { git = "https://github.com/wey-gu/zed", rev = "94f3f2c80f3e55170d485b228ad8e5107922b90b" }
gpui-pre-macos = { git = "https://github.com/wey-gu/zed", rev = "655ce8bbc10e1f1ef3d1d5bdf5a3405008157792" }
